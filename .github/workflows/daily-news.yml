name: Generate daily news

on:
  schedule:
    # 08:30 Asia/Seoul (23:30 UTC on the previous day)
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Collect news
        run: npm run news:collect
      - name: Prepare news
        run: npm run news:prepare
      - name: Generate Markdown
        run: npm run news:generate
      - name: Validate news
        run: npm run news:validate
      - name: Commit generated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed src/content/news
          git diff --cached --quiet || git commit -m "news: $(date -u +%F) morning briefing"
          git push origin HEAD:main
